#
# ----------------------------
# Hub config:
# ----------------------------

# Enable hub-first login routing.
# Default: false
gameserver.hub.login.routing.enabled = false

# Enable isolated instance-based hub routing.
# Default: true
gameserver.hub.login.instance.enabled = true

# Isolated hub instance map and spawn position.
# Loaded from ./config/main/hub.properties via Config.loadProperties().
# The default map reuses an existing instance-type arena map through a custom hub instance handler,
# so the hub can stay isolated from shared Sanctum world content.
gameserver.hub.login.instance.world_id = 310080000
gameserver.hub.login.instance.x = 275.7
gameserver.hub.login.instance.y = 215.9
gameserver.hub.login.instance.z = 160.0
gameserver.hub.login.instance.heading = 30
gameserver.hub.login.instance.max_players = 100

# Explicit hub exit destination into classic open world.
# This is the hub-owned path used instead of the reused arena instance_exit flow.
gameserver.hub.exit.open_world.world_id = 110010000
gameserver.hub.exit.open_world.x = 1460.36
gameserver.hub.exit.open_world.y = 1448.84
gameserver.hub.exit.open_world.z = 572.87524
gameserver.hub.exit.open_world.heading = 7

# Legacy shared-world fallback destination.
# Keep this for backwards understanding and as a non-instance fallback path.
gameserver.hub.login.destination.world_id = 110010000

# Legacy shared-world fallback coordinates.
gameserver.hub.login.destination.x = 1462.5
gameserver.hub.login.destination.y = 1326.1
gameserver.hub.login.destination.z = 564.1
gameserver.hub.login.destination.heading = 0
